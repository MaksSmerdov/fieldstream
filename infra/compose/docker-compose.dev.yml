# Оверрайд для разработки: наружу открываются порты, которые на стенде остаются внутренними.
# База нужна миграциям и интеграционным тестам с хоста, шлюз дев-серверу vite и отладке
# запросов curl. На самом стенде единственный вход это nginx на 8080.
services:
  timescaledb:
    ports:
      - '127.0.0.1:5432:5432'

  api-gateway:
    ports:
      - '127.0.0.1:8093:8093'
