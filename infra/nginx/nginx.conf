worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # Токен доступа к потоку событий едет строкой запроса, поэтому в журнал пишется только путь
  log_format single '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log single;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Соединение к шлюзу переиспользуется, но живёт меньше, чем keepAliveTimeout fastify (72 с):
  # иначе шлюз закрывал бы соединение ровно в момент отправки следующего запроса
  upstream gateway {
    server api-gateway:8093;
    keepalive 16;
    keepalive_timeout 60s;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Живой канал. Буферизация здесь ломает не задержку, а сам протокол: заголовки уходят
    # вместе с первым кадром hello, и пока прокси копит ответ, вкладка не получает ни того,
    # ни другого. Тайм-аут чтения берётся с запасом от предела keepalive шлюза (120 с),
    # иначе прокси рвёт поток в паузе между пингами
    location = /api/events {
      proxy_pass http://gateway;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Префикс /api принадлежит самому шлюзу, и по этому же пути лежит кука обновления
    # (path=/api/auth): срезать префикс нельзя, иначе браузер перестанет её отправлять
    location /api/ {
      proxy_pass http://gateway;
      proxy_read_timeout 60s;
    }

    location /health/ {
      proxy_pass http://gateway;
      access_log off;
    }

    # Готовность самого входа: отдельно от шлюза, чтобы healthcheck не зависел от его состояния
    location = /healthz {
      access_log off;
      add_header content-type text/plain always;
      return 200 'ok';
    }

    # Имена файлов сборки содержат хеш содержимого, поэтому их можно держать в кэше сколько угодно
    location /assets/ {
      expires 1y;
      add_header cache-control 'public, immutable';
    }

    # Маршруты приложения живут в адресной строке: заход прямо на /device/RC-101 должен
    # отдавать оболочку, а не 404. Саму оболочку кэшировать нельзя, иначе после обновления
    # стенда вкладка продолжит просить файлы предыдущей сборки
    location / {
      try_files $uri $uri/ /index.html;
      add_header cache-control 'no-store' always;
    }
  }
}
