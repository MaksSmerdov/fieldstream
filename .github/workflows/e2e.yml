name: Стенд

# Тяжёлые проверки: они поднимают настоящие Kafka, TimescaleDB и весь стенд в Docker,
# поэтому идут на main, по расписанию и по кнопке, а не на каждый пуш в рабочие ветки
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

env:
  # Пароли одноразовые: стенд поднимается с нуля и сносится вместе с томами
  FIELDSTREAM_ENV: |
    POSTGRES_USER=fieldstream
    POSTGRES_PASSWORD=ci-postgres-pw
    FS_MIGRATOR_PASSWORD=ci-migrator-pw
    FS_INGEST_PASSWORD=ci-ingest-pw
    FS_API_PASSWORD=ci-api-pw
    SIM_SEED=fieldstream
    SIM_SPEED=1
    SIM_TURNAROUND_MS=5
    SIM_BUS_TIMEOUT_MS=500
    SIM_STALL_MS=5000
    KAFKA_BROKERS=localhost:29092
    MODBUS_HOST_OVERRIDE=127.0.0.1
    COLLECTOR_HTTP_PORT=8091
    LOG_LEVEL=info
    GATEWAY_HTTP_PORT=8093
    CORS_ORIGINS=http://localhost:5173
    AUTH_SECRET=ci-secret-not-shorter-than-thirty-two-chars
    DEMO_PASSWORD=fieldstream
    SEED_DAYS=2
    SEED_COMPRESS=off

jobs:
  integration:
    name: Интеграционные тесты на настоящих Kafka и базе
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Интеграционные тесты
        run: pnpm test:integration

  stack:
    name: Сценарии против поднятого стенда
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/stack-up
        id: stand
        with:
          stand-env: ${{ env.FIELDSTREAM_ENV }}

      # Сумма пределов всех сценариев около 40 минут, обычно прогон идёт вдвое быстрее. Свой
      # предел у шага нужен, чтобы зависший прогон уронил шаг, а не съел лимит задачи вместе с
      # диагностикой. Пароль учётки инженера берётся из окружения стенда, второй копии у него нет
      - name: Сценарии стенда
        timeout-minutes: 50
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EMAIL: engineer@fieldstream.local
        run: |
          E2E_PASSWORD="$(printf '%s\n' "$FIELDSTREAM_ENV" | sed -n 's/^DEMO_PASSWORD=//p')" \
            pnpm scenarios:ci

      # Сценарии интерфейса проверяют другое и идут при любом итоге сценариев стенда, если стенд
      # поднялся. Контракты они импортируют из собранного пакета, образы стенда его на хост не кладут
      - name: Контракты для сценариев Playwright
        if: ${{ !cancelled() && steps.stand.outcome == 'success' }}
        run: pnpm --filter @fieldstream/contracts run build

      - name: Браузер для сценариев
        if: ${{ !cancelled() && steps.stand.outcome == 'success' }}
        run: pnpm --filter @fieldstream/web exec playwright install --with-deps chromium

      - name: Сценарии Playwright
        if: ${{ !cancelled() && steps.stand.outcome == 'success' }}
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_CHANNEL: ''
        run: pnpm --filter @fieldstream/web exec playwright test

      - name: Состояние стенда при падении
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.yml ps -a
          docker compose -f infra/compose/docker-compose.yml logs --tail 200

      - name: Следы упавших сценариев
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

      - name: Снести стенд
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
