name: Документы

# Проверка документов идёт на запрос слияния в main и по кнопке: ссылки ломаются переименованием
# файлов и правкой заголовков, а увидеть это до слияния дешевле, чем в опубликованном README
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Ссылки и пути в документах
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ссылки в документах
        run: pnpm docs:links
